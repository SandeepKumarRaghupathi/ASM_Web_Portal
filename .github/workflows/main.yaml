name: Deploy Streamlit App Securely

on:
  push:
    branches: [ Sandeep ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Save GCP key to file
        run: echo '${{ secrets.GCP_KEY_JSON }}' > gcp-key.json

      - name: Set GOOGLE_APPLICATION_CREDENTIALS
        run: |
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/gcp-key.json" >> $GITHUB_ENV
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/gcp-key.json
          echo "Credential path: $GOOGLE_APPLICATION_CREDENTIALS"

      - name: Run Streamlit app
        run: streamlit run Web_App.py
