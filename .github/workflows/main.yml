name: Deploy Streamlit App Securely

on:
  push:
    branches: [ Sandeep ]  # or any branch you want

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode GCP key and save to file
        run: |
          echo "${{ secrets.GCP_KEY_JSON_BASE64 }}" | base64 --decode > gcp-key.json

      - name: Set GOOGLE_APPLICATION_CREDENTIALS
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/gcp-key.json" >> $GITHUB_ENV

      - name: Run Streamlit app
        run: streamlit run Web_App.py  # Adjust the script name
